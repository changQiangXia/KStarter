<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200" role="img" aria-labelledby="title desc">
  <title id="title">Closing the Loop After a Wave</title>
  <desc id="desc">A feedback-loop diagram showing online submission, regression isolation, knowledge consolidation, and prioritization of the next scheduler wave.</desc>
  <defs>
    <style>
      .title { font: 700 62px Arial, sans-serif; fill: #08255b; }
      .head { font: 700 24px Arial, sans-serif; fill: white; }
      .body { font: 600 23px Arial, sans-serif; fill: #10295b; }
      .small { font: 500 19px Arial, sans-serif; fill: #25395f; }
      .branch { font: 700 24px Arial, sans-serif; }
      .caption { font: 700 38px Arial, sans-serif; fill: #08255b; }
      .card { fill: white; stroke: #0b3278; stroke-width: 3; rx: 15; }
      .header { fill: #0755ad; }
      .green-card { fill: #f5fff6; stroke: #11842d; stroke-width: 3; rx: 15; }
      .orange-card { fill: #fff9f4; stroke: #ed5314; stroke-width: 3; rx: 15; }
      .blue-line { fill: none; stroke: #092b67; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .green-line { fill: none; stroke: #16862d; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .orange-line { fill: none; stroke: #ed5314; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
    </style>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#092b67"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#16862d"/>
    </marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ed5314"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0b2550" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="2400" height="1200" fill="#ffffff"/>
  <text class="title" x="1200" y="82" text-anchor="middle">Closing the Loop After a Wave</text>

  <!-- Main path -->
  <g filter="url(#shadow)">
    <rect class="card" x="50" y="220" width="230" height="190"/>
    <path class="header" d="M65 220 H265 A15 15 0 0 1 280 235 V278 H50 V235 A15 15 0 0 1 65 220 Z"/>
    <text class="head" x="165" y="258" text-anchor="middle">Scheduler Wave</text>
    <circle cx="165" cy="337" r="38" fill="none" stroke="#0b3278" stroke-width="5"/>
    <path d="M165 309 V337 L190 352" fill="none" stroke="#0b3278" stroke-width="5" stroke-linecap="round"/>

    <rect class="card" x="330" y="220" width="270" height="190"/>
    <path class="header" d="M345 220 H585 A15 15 0 0 1 600 235 V278 H330 V235 A15 15 0 0 1 345 220 Z"/>
    <text class="head" x="465" y="258" text-anchor="middle">Package Changed Tasks</text>
    <g fill="#f6f9ff" stroke="#0b3278" stroke-width="3">
      <path d="M382 305 h48 l18 18 v60 h-66 z"/><path d="M465 305 h48 l18 18 v60 h-66 z"/><path d="M548 305 h18 l18 18 v60 h-36 z"/>
    </g>
    <text class="small" x="415" y="367" text-anchor="middle">ONNX</text>
    <text class="small" x="498" y="367" text-anchor="middle">ONNX</text>
    <text class="small" x="566" y="367" text-anchor="middle">ONNX</text>

    <rect class="card" x="650" y="220" width="230" height="190"/>
    <path class="header" d="M665 220 H865 A15 15 0 0 1 880 235 V278 H650 V235 A15 15 0 0 1 665 220 Z"/>
    <text class="head" x="765" y="258" text-anchor="middle">Online Submission</text>
    <path d="M705 365 h120 M720 365 v-55 h90 v55 M765 342 v-46 M747 314 l18-18 18 18" fill="none" stroke="#0b3278" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

    <rect class="card" x="930" y="220" width="350" height="190"/>
    <path class="header" d="M945 220 H1265 A15 15 0 0 1 1280 235 V278 H930 V235 A15 15 0 0 1 945 220 Z"/>
    <text class="head" x="1105" y="258" text-anchor="middle">Compare Gains</text>
    <text class="small" x="1105" y="327" text-anchor="middle">Expected Gain = Σ(New Local − Previous)</text>
    <line x1="960" y1="348" x2="1250" y2="348" stroke="#86a3cf" stroke-width="2"/>
    <text class="small" x="1105" y="386" text-anchor="middle">Online Gap = Expected − Observed</text>
  </g>

  <path class="blue-line" d="M280 315 H330" marker-end="url(#blueArrow)"/>
  <path class="blue-line" d="M600 315 H650" marker-end="url(#blueArrow)"/>
  <path class="blue-line" d="M880 315 H930" marker-end="url(#blueArrow)"/>
  <path class="blue-line" d="M1280 315 H1345" marker-end="url(#blueArrow)"/>

  <!-- Decision -->
  <path d="M1430 225 L1515 315 L1430 405 L1345 315 Z" fill="white" stroke="#092b67" stroke-width="4" filter="url(#shadow)"/>
  <text class="body" x="1430" y="306" text-anchor="middle">Score</text>
  <text class="body" x="1430" y="336" text-anchor="middle">Matches?</text>

  <!-- Success path -->
  <text class="branch" x="1515" y="178" fill="#16862d">YES</text>
  <path class="green-line" d="M1485 255 V165 H1560" marker-end="url(#greenArrow)"/>
  <g filter="url(#shadow)">
    <rect class="green-card" x="1560" y="115" width="210" height="100"/>
    <circle cx="1602" cy="165" r="23" fill="none" stroke="#16862d" stroke-width="4"/>
    <path d="M1591 165 l8 9 16-20" fill="none" stroke="#16862d" stroke-width="4" stroke-linecap="round"/>
    <text x="1662" y="173" text-anchor="middle" style="font:700 20px Arial,sans-serif;fill:#116c27">Online-Confirmed</text>
    <rect class="green-card" x="1820" y="115" width="220" height="100"/>
    <text x="1930" y="155" text-anchor="middle" style="font:700 20px Arial,sans-serif;fill:#116c27">Collect Trick</text>
    <text x="1930" y="184" text-anchor="middle" style="font:700 20px Arial,sans-serif;fill:#116c27">Candidates</text>
  </g>
  <path class="green-line" d="M1770 165 H1820" marker-end="url(#greenArrow)"/>
  <path class="green-line" d="M2040 165 H2240 V380" marker-end="url(#greenArrow)"/>

  <!-- Regression path -->
  <text class="branch" x="1515" y="415" fill="#ed5314">NO</text>
  <path class="orange-line" d="M1485 375 V470 H1530" marker-end="url(#orangeArrow)"/>
  <g filter="url(#shadow)">
    <rect class="orange-card" x="1530" y="420" width="210" height="100"/>
    <text x="1635" y="460" text-anchor="middle" style="font:700 19px Arial,sans-serif;fill:#d9480b">Grouped /</text>
    <text x="1635" y="489" text-anchor="middle" style="font:700 19px Arial,sans-serif;fill:#d9480b">Bisected Probes</text>
    <rect class="orange-card" x="1790" y="420" width="190" height="100"/>
    <text x="1885" y="460" text-anchor="middle" style="font:700 19px Arial,sans-serif;fill:#d9480b">Isolate</text>
    <text x="1885" y="489" text-anchor="middle" style="font:700 19px Arial,sans-serif;fill:#d9480b">Failing Task</text>
    <rect class="orange-card" x="2030" y="420" width="210" height="100"/>
    <text x="2135" y="460" text-anchor="middle" style="font:700 19px Arial,sans-serif;fill:#d9480b">Revert or</text>
    <text x="2135" y="489" text-anchor="middle" style="font:700 19px Arial,sans-serif;fill:#d9480b">Quarantine</text>
  </g>
  <path class="orange-line" d="M1740 470 H1790" marker-end="url(#orangeArrow)"/>
  <path class="orange-line" d="M1980 470 H2030" marker-end="url(#orangeArrow)"/>
  <path class="orange-line" d="M2240 470 V420" marker-end="url(#orangeArrow)"/>

  <!-- Explicit merge and knowledge path -->
  <circle cx="2240" cy="400" r="14" fill="white" stroke="#092b67" stroke-width="5"/>
  <path class="blue-line" d="M2240 414 V610 H435 V675" marker-end="url(#blueArrow)"/>

  <g filter="url(#shadow)">
    <rect class="card" x="300" y="675" width="270" height="190"/>
    <path class="header" d="M315 675 H555 A15 15 0 0 1 570 690 V735 H300 V690 A15 15 0 0 1 315 675 Z"/>
    <text class="head" x="435" y="715" text-anchor="middle">Update Task Docs</text>
    <text class="body" x="435" y="790" text-anchor="middle">Hidden / Online</text>
    <text class="body" x="435" y="824" text-anchor="middle">Risk History</text>

    <rect class="card" x="650" y="675" width="360" height="190"/>
    <path class="header" d="M665 675 H995 A15 15 0 0 1 1010 690 V735 H650 V690 A15 15 0 0 1 665 675 Z"/>
    <text class="head" x="830" y="715" text-anchor="middle">Serialized Codex Consolidation</text>
    <text class="body" x="830" y="788" text-anchor="middle">One Worker</text>
    <text class="small" x="830" y="825" text-anchor="middle">No Write Conflicts</text>

    <rect class="card" x="1090" y="675" width="220" height="190"/>
    <path d="M1150 720 h70 l30 30 v70 h-100 z M1220 720 v30 h30" fill="#f6f9ff" stroke="#0b3278" stroke-width="4" stroke-linejoin="round"/>
    <line x1="1170" y1="775" x2="1230" y2="775" stroke="#0b3278" stroke-width="4"/>
    <line x1="1170" y1="795" x2="1220" y2="795" stroke="#0b3278" stroke-width="4"/>
    <text class="body" x="1200" y="850" text-anchor="middle">docs/tricks.md</text>

    <rect class="card" x="1390" y="675" width="270" height="190"/>
    <path class="header" d="M1405 675 H1645 A15 15 0 0 1 1660 690 V735 H1390 V690 A15 15 0 0 1 1405 675 Z"/>
    <text class="head" x="1525" y="715" text-anchor="middle">Prioritize Next Wave</text>
    <path d="M1465 823 l35-35 28 18 58-58 M1566 748 h20 v20" fill="none" stroke="#0b3278" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path class="blue-line" d="M570 770 H650" marker-end="url(#blueArrow)"/>
  <path class="blue-line" d="M1010 770 H1090" marker-end="url(#blueArrow)"/>
  <path class="blue-line" d="M1310 770 H1390" marker-end="url(#blueArrow)"/>

  <!-- Feedback -->
  <path class="blue-line" d="M1660 770 H1740 V1030 H165 V415" marker-end="url(#blueArrow)"/>
  <text class="caption" x="950" y="1125" text-anchor="middle">submit → diagnose → consolidate → feed back</text>
</svg>
