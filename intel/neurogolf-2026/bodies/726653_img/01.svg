<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1450" viewBox="0 0 2800 1450" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Turn Codex Scheduler</title>
  <desc id="desc">Architecture of a bounded multi-turn Codex worker pool with per-task sessions, transactional validation, rollback, and resumable state.</desc>
  <defs>
    <style>
      .title { font: 700 70px Arial, sans-serif; fill: #08255b; }
      .section { font: 700 29px Arial, sans-serif; fill: white; }
      .label { font: 700 25px Arial, sans-serif; fill: #10295b; }
      .body { font: 500 23px Arial, sans-serif; fill: #172b4d; }
      .small { font: 500 20px Arial, sans-serif; fill: #254066; }
      .tiny { font: 500 18px Arial, sans-serif; fill: #254066; }
      .caption { font: 700 39px Arial, sans-serif; fill: #08255b; }
      .panel { fill: white; stroke: #092b67; stroke-width: 4; rx: 18; }
      .card { fill: #f9fbff; stroke: #5e8dcc; stroke-width: 3; rx: 15; }
      .worker { fill: #f3fcfb; stroke: #08716b; stroke-width: 4; rx: 17; }
      .green { fill: #f4fff5; stroke: #16862d; stroke-width: 3; rx: 14; }
      .orange { fill: #fff8f3; stroke: #ed5314; stroke-width: 3; rx: 14; }
      .blue { fill: #f7faff; stroke: #0b55aa; stroke-width: 3; rx: 14; }
      .line { fill: none; stroke: #092b67; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .dash { fill: none; stroke: #092b67; stroke-width: 4; stroke-dasharray: 13 10; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 Z" fill="#092b67"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0b2550" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="2800" height="1450" fill="white"/>
  <text class="title" x="1400" y="90" text-anchor="middle">Multi-Turn Codex Scheduler</text>

  <!-- Strategy and queue -->
  <g filter="url(#shadow)">
    <rect class="panel" x="40" y="175" width="330" height="760"/>
    <path d="M58 175 H352 A18 18 0 0 1 370 193 V255 H40 V193 A18 18 0 0 1 58 175 Z" fill="#0755ad"/>
    <text class="section" x="205" y="224" text-anchor="middle">Strategy &amp; Queue</text>

    <rect class="card" x="75" y="300" width="260" height="145"/>
    <circle cx="120" cy="366" r="28" fill="#eaf2ff" stroke="#0b55aa" stroke-width="3"/>
    <circle cx="120" cy="356" r="10" fill="#0b55aa"/><path d="M101 389 q19-25 38 0" fill="#0b55aa"/>
    <text class="label" x="220" y="356" text-anchor="middle">Human</text><text class="label" x="220" y="388" text-anchor="middle">Strategy</text>

    <rect class="card" x="75" y="500" width="260" height="145"/>
    <path d="M95 535 h45 l18 18 v57 h-63 z M140 535 v18 h18" fill="white" stroke="#0b55aa" stroke-width="4" stroke-linejoin="round"/>
    <line x1="110" y1="570" x2="143" y2="570" stroke="#0b55aa" stroke-width="3"/><line x1="110" y1="586" x2="143" y2="586" stroke="#0b55aa" stroke-width="3"/>
    <text class="label" x="242" y="580" text-anchor="middle">reval_scores.txt</text>

    <rect class="card" x="75" y="700" width="260" height="145"/>
    <path d="M132 750 a35 35 0 1 1 -8-15 M124 735 h-24 v-24" fill="none" stroke="#0b55aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="230" y="756" text-anchor="middle">Previous</text><text class="label" x="230" y="788" text-anchor="middle">Attempts</text>
  </g>

  <!-- Scheduler -->
  <g filter="url(#shadow)">
    <rect class="panel" x="420" y="175" width="380" height="760"/>
    <path d="M438 175 H782 A18 18 0 0 1 800 193 V255 H420 V193 A18 18 0 0 1 438 175 Z" fill="#0755ad"/>
    <text class="section" x="610" y="224" text-anchor="middle">Multi-Turn Scheduler</text>

    <rect class="card" x="455" y="292" width="310" height="130"/>
    <circle cx="510" cy="357" r="32" fill="none" stroke="#0b55aa" stroke-width="4"/><path d="M510 357 l19-22 M510 325 v8 M482 357 h8" stroke="#0b55aa" stroke-width="4" stroke-linecap="round"/>
    <text class="label" x="640" y="350" text-anchor="middle">Bounded</text><text class="label" x="640" y="382" text-anchor="middle">Concurrency</text>

    <rect class="card" x="455" y="450" width="310" height="130"/>
    <circle cx="500" cy="515" r="10" fill="#0b55aa"/><circle cx="540" cy="485" r="10" fill="#0b55aa"/><circle cx="548" cy="548" r="10" fill="#0b55aa"/>
    <path d="M508 508 L532 492 M508 521 L540 543" stroke="#0b55aa" stroke-width="5"/>
    <text class="label" x="655" y="508" text-anchor="middle">Dynamic</text><text class="label" x="655" y="540" text-anchor="middle">Dispatch</text>

    <rect class="card" x="455" y="608" width="310" height="130"/>
    <circle cx="515" cy="673" r="34" fill="none" stroke="#0b55aa" stroke-width="4"/><path d="M515 650 v26 l18 12" fill="none" stroke="#0b55aa" stroke-width="4" stroke-linecap="round"/>
    <text class="label" x="650" y="666" text-anchor="middle">Timeouts &amp;</text><text class="label" x="650" y="698" text-anchor="middle">Retries</text>

    <rect class="card" x="455" y="766" width="310" height="130"/>
    <ellipse cx="510" cy="805" rx="31" ry="13" fill="#0b55aa"/><path d="M479 805 v42 c0 18 62 18 62 0 v-42 M479 826 c0 18 62 18 62 0" fill="#0b55aa" stroke="white" stroke-width="3"/>
    <text class="label" x="650" y="824" text-anchor="middle">Persistent</text><text class="label" x="650" y="856" text-anchor="middle">TaskState</text>
  </g>

  <!-- Turn control -->
  <g filter="url(#shadow)">
    <rect class="panel" x="900" y="140" width="690" height="130"/>
    <path d="M955 202 a34 34 0 1 1 10 24 M965 226 h25 v25" fill="none" stroke="#0b55aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="1050" y="190">Turn 1:</text><text class="body" x="1165" y="190">codex exec</text>
    <text class="label" x="1050" y="232">Turn 2+:</text><text class="body" x="1190" y="232">codex exec resume &lt;session_id&gt;</text>
  </g>

  <!-- Worker pool -->
  <path class="line" d="M1245 270 V335 M1245 335 H975 V390 M1245 335 V390 M1245 335 H1515 V390" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect class="worker" x="850" y="390" width="250" height="420"/>
    <text class="label" x="975" y="445" text-anchor="middle">Task A · Turn k</text>
    <rect x="920" y="485" width="110" height="80" rx="8" fill="white" stroke="#08716b" stroke-width="4"/>
    <text x="975" y="538" text-anchor="middle" style="font:700 38px monospace;fill:#08716b">&lt;/&gt;</text>
    <line x1="880" y1="598" x2="1070" y2="598" stroke="#75aaa7" stroke-width="2"/>
    <text class="body" x="975" y="640" text-anchor="middle">Persistent</text><text class="body" x="975" y="672" text-anchor="middle">Codex Session</text>
    <rect x="895" y="715" width="160" height="48" rx="8" fill="#e6f8f5" stroke="#08716b" stroke-width="2"/><text class="small" x="975" y="746" text-anchor="middle">session_id_A</text>

    <rect class="worker" x="1120" y="390" width="250" height="420"/>
    <text class="label" x="1245" y="445" text-anchor="middle">Task B · Turn k</text>
    <rect x="1190" y="485" width="110" height="80" rx="8" fill="white" stroke="#08716b" stroke-width="4"/>
    <text x="1245" y="538" text-anchor="middle" style="font:700 38px monospace;fill:#08716b">&lt;/&gt;</text>
    <line x1="1150" y1="598" x2="1340" y2="598" stroke="#75aaa7" stroke-width="2"/>
    <text class="body" x="1245" y="640" text-anchor="middle">Persistent</text><text class="body" x="1245" y="672" text-anchor="middle">Codex Session</text>
    <rect x="1165" y="715" width="160" height="48" rx="8" fill="#e6f8f5" stroke="#08716b" stroke-width="2"/><text class="small" x="1245" y="746" text-anchor="middle">session_id_B</text>

    <rect class="worker" x="1390" y="390" width="250" height="420"/>
    <text class="label" x="1515" y="445" text-anchor="middle">Task N · Turn k</text>
    <rect x="1460" y="485" width="110" height="80" rx="8" fill="white" stroke="#08716b" stroke-width="4"/>
    <text x="1515" y="538" text-anchor="middle" style="font:700 38px monospace;fill:#08716b">&lt;/&gt;</text>
    <line x1="1420" y1="598" x2="1610" y2="598" stroke="#75aaa7" stroke-width="2"/>
    <text class="body" x="1515" y="640" text-anchor="middle">Persistent</text><text class="body" x="1515" y="672" text-anchor="middle">Codex Session</text>
    <rect x="1435" y="715" width="160" height="48" rx="8" fill="#e6f8f5" stroke="#08716b" stroke-width="2"/><text class="small" x="1515" y="746" text-anchor="middle">session_id_N</text>
  </g>
  <text class="label" x="1368" y="600" text-anchor="middle">···</text>
  <path class="dash" d="M835 830 V860 Q835 885 860 885 H1630 Q1655 885 1655 860 V830"/>
  <text class="body" x="1245" y="930" text-anchor="middle">N workers run concurrently (bounded pool)</text>
  <text class="body" x="1245" y="963" text-anchor="middle">One persistent session per task</text>

  <!-- Validation gate -->
  <path class="line" d="M800 555 H850" marker-end="url(#arrow)"/>
  <path class="line" d="M1640 600 H1690" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect class="panel" x="1690" y="265" width="330" height="650"/>
    <path d="M1708 265 H2002 A18 18 0 0 1 2020 283 V370 H1690 V283 A18 18 0 0 1 1708 265 Z" fill="#0755ad"/>
    <text class="section" x="1855" y="315" text-anchor="middle">Transactional</text><text class="section" x="1855" y="350" text-anchor="middle">Validation Gate</text>

    <rect class="card" x="1725" y="410" width="260" height="125"/>
    <circle cx="1775" cy="472" r="25" fill="none" stroke="#0b55aa" stroke-width="4"/><path d="M1764 472 l8 9 16-20 M1792 491 l18 20" fill="none" stroke="#0b55aa" stroke-width="4" stroke-linecap="round"/>
    <text class="label" x="1905" y="480" text-anchor="middle">ONNX Checker</text>

    <rect class="card" x="1725" y="565" width="260" height="125"/>
    <circle cx="1775" cy="627" r="28" fill="none" stroke="#0b55aa" stroke-width="8" stroke-dasharray="10 5"/><circle cx="1775" cy="627" r="9" fill="#0b55aa"/>
    <text class="label" x="1905" y="618" text-anchor="middle">Runtime</text><text class="label" x="1905" y="650" text-anchor="middle">Correctness</text>

    <rect class="card" x="1725" y="720" width="260" height="150"/>
    <rect x="1752" y="762" width="48" height="67" rx="7" fill="none" stroke="#0b55aa" stroke-width="4"/><circle cx="1765" cy="780" r="3" fill="#0b55aa"/><circle cx="1780" cy="780" r="3" fill="#0b55aa"/><circle cx="1765" cy="798" r="3" fill="#0b55aa"/><circle cx="1780" cy="798" r="3" fill="#0b55aa"/>
    <text class="body" x="1905" y="770" text-anchor="middle">Official Cost =</text><text class="body" x="1905" y="804" text-anchor="middle">Memory +</text><text class="body" x="1905" y="838" text-anchor="middle">Parameters</text>
  </g>
  <path class="line" d="M1855 535 V565" marker-end="url(#arrow)"/><path class="line" d="M1855 690 V720" marker-end="url(#arrow)"/>

  <!-- Outcomes -->
  <path class="line" d="M2020 470 H2080" marker-end="url(#arrow)"/><path class="line" d="M2020 625 H2080" marker-end="url(#arrow)"/><path class="line" d="M2020 795 H2080" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect class="green" x="2080" y="410" width="250" height="120"/><text x="2205" y="462" text-anchor="middle" style="font:700 25px Arial,sans-serif;fill:#116c27">Promote</text><text x="2205" y="495" text-anchor="middle" style="font:700 25px Arial,sans-serif;fill:#116c27">Candidate</text>
    <rect class="orange" x="2080" y="565" width="250" height="120"/><text x="2205" y="617" text-anchor="middle" style="font:700 25px Arial,sans-serif;fill:#d9480b">Restore</text><text x="2205" y="650" text-anchor="middle" style="font:700 25px Arial,sans-serif;fill:#d9480b">Backup</text>
    <rect class="blue" x="2080" y="735" width="250" height="120"/><text x="2205" y="787" text-anchor="middle" style="font:700 25px Arial,sans-serif;fill:#0b55aa">Stash for</text><text x="2205" y="820" text-anchor="middle" style="font:700 25px Arial,sans-serif;fill:#0b55aa">Repair</text>
  </g>

  <!-- TaskState and stop/report -->
  <path class="line" d="M2330 470 H2380 V625 H2420"/><path class="line" d="M2330 625 H2420"/><path class="line" d="M2330 795 H2380 V625"/>
  <g filter="url(#shadow)">
    <rect class="blue" x="2420" y="530" width="250" height="190"/>
    <ellipse cx="2545" cy="575" rx="36" ry="15" fill="#0755ad"/><path d="M2509 575 v48 c0 20 72 20 72 0 v-48 M2509 599 c0 20 72 20 72 0" fill="#0755ad" stroke="white" stroke-width="3"/>
    <text class="label" x="2545" y="670" text-anchor="middle">Update TaskState</text>

    <rect class="orange" x="2400" y="805" width="290" height="115"/>
    <text x="2545" y="852" text-anchor="middle" style="font:700 22px Arial,sans-serif;fill:#d9480b">Stop after round /</text><text x="2545" y="883" text-anchor="middle" style="font:700 22px Arial,sans-serif;fill:#d9480b">no-improvement limit</text>

    <rect class="blue" x="2380" y="985" width="330" height="105"/>
    <text class="label" x="2545" y="1048" text-anchor="middle">Reports &amp; Next Wave</text>
  </g>
  <path class="line" d="M2545 720 V805" marker-end="url(#arrow)"/><path class="line" d="M2545 920 V985" marker-end="url(#arrow)"/>

  <!-- Next-turn feedback -->
  <path class="line" d="M2470 720 C2470 1140 1400 1140 610 1140 V940" marker-end="url(#arrow)"/>
  <text class="caption" x="1460" y="1110" text-anchor="middle">Next Turn</text>
  <text class="caption" x="1400" y="1340" text-anchor="middle">backup → experiment → validate → promote or restore</text>
</svg>
