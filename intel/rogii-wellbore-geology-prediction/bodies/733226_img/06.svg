<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" font-family="'Segoe UI',Arial,sans-serif" font-size="12">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .mono{font-family:ui-monospace,Consolas,'Courier New',monospace;font-size:11.5px;fill:#1f2937;}
      .box{stroke-width:1.2;}
      .ttl{font-weight:700;fill:#111827;font-size:12.5px;}
      .dim{fill:#6b7280;font-size:10.5px;}
      .tag{font-family:ui-monospace,Consolas,monospace;font-size:12px;fill:#b45309;font-weight:700;}
    </style>
  </defs>
  <rect x="0" y="0" width="1020" height="430" fill="#ffffff"/>
  <text x="510" y="24" text-anchor="middle" class="ttl" font-size="16">Candidate-curve ensembler — architecture (B=batch, T=rows, K=candidates, d=64, NF=2)</text>

  <!-- inputs -->
  <rect class="box" x="14" y="52" width="180" height="150" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="104" y="72" text-anchor="middle" class="ttl">input tensors</text>
  <text x="26" y="94"  class="mono">D  (B,T,K)   ΔTVT cands</text>
  <text x="26" y="114" class="mono">S  (B,T,K)   uncertainty</text>
  <text x="26" y="134" class="mono">DX (B,T,K,NF) cand feats</text>
  <text x="26" y="154" class="mono">C  (B,T,Cd)  context feats</text>
  <text x="26" y="182" class="dim">D/S/DX→encoder, C→query</text>

  <!-- encoder path (keys) -->
  <rect class="box" x="214" y="52" width="176" height="72" rx="8" fill="#eef6ee" stroke="#8fbf8f"/>
  <text x="302" y="74"  text-anchor="middle" class="mono">stack[D−med, logS, DX]</text>
  <text x="302" y="92"  text-anchor="middle" class="mono">→ (B,T, 2+NF, K)</text>
  <text x="302" y="110" text-anchor="middle" class="mono">→ (B·K, 2+NF, T)</text>

  <rect class="box" x="410" y="52" width="196" height="72" rx="8" fill="#eef6ee" stroke="#8fbf8f"/>
  <text x="508" y="74"  text-anchor="middle" class="mono">Conv1d ×3  (k=9,</text>
  <text x="508" y="92"  text-anchor="middle" class="mono">dil 1/4/16) + GELU</text>
  <text x="508" y="110" text-anchor="middle" class="mono">→ (B·K, d, T)</text>

  <rect class="box" x="626" y="52" width="184" height="72" rx="8" fill="#eef6ee" stroke="#8fbf8f"/>
  <text x="718" y="74"  text-anchor="middle" class="mono">reshape → (B,T,K,d)</text>
  <text x="718" y="92"  text-anchor="middle" class="mono">+ Emb(K,d)</text>
  <text x="718" y="110" text-anchor="middle" class="mono">= keys  h (B,T,K,d)</text>

  <!-- query path -->
  <rect class="box" x="214" y="238" width="212" height="62" rx="8" fill="#f3eefb" stroke="#b49bd8"/>
  <text x="320" y="262" text-anchor="middle" class="mono">stats=[C, med, std, agree]</text>
  <text x="320" y="283" text-anchor="middle" class="mono">→ (B,T, Cd+4)</text>

  <rect class="box" x="450" y="238" width="156" height="62" rx="8" fill="#f3eefb" stroke="#b49bd8"/>
  <text x="528" y="262" text-anchor="middle" class="mono">MLP (→d→d)</text>
  <text x="528" y="283" text-anchor="middle" class="mono">= query q (B,T,d)</text>

  <!-- attention -->
  <rect class="box" x="640" y="176" width="196" height="104" rx="8" fill="#fff7ec" stroke="#e0b072"/>
  <text x="738" y="202" text-anchor="middle" class="mono">attn = ⟨h, q⟩ / √d</text>
  <text x="738" y="222" text-anchor="middle" class="mono">→ (B,T,K)</text>
  <text x="738" y="244" text-anchor="middle" class="mono">softmax over K</text>
  <text x="738" y="264" text-anchor="middle" class="mono">= weights w (B,T,K)</text>

  <!-- output -->
  <rect class="box" x="620" y="330" width="384" height="78" rx="8" fill="#eaf3fb" stroke="#7aa8d6"/>
  <text x="812" y="356" text-anchor="middle" class="mono" font-size="13">ŷ = Σ&#8342; w&#8342; · D&#8342;   ( + 2·tanh(W·q) )</text>
  <text x="812" y="377" text-anchor="middle" class="mono">→ (B,T)  predicted ΔTVT</text>
  <text x="812" y="396" text-anchor="middle" class="dim">weights w = attention, values = raw D  (weighted avg / bagging)</text>

  <!-- encoder chain -->
  <line x1="194" y1="88" x2="211" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="390" y1="88" x2="407" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="606" y1="88" x2="623" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- keys h -> attention (drop down) -->
  <line x1="718" y1="124" x2="718" y2="174" stroke="#555" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="726" y="150" class="tag">h</text>
  <!-- inputs(C) -> query -->
  <path d="M150,202 C176,232 190,258 211,262" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- query stats -> MLP -->
  <line x1="426" y1="269" x2="447" y2="269" stroke="#555" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- query q -> attention (up-right into left edge) -->
  <path d="M606,258 C625,250 632,234 638,230" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="612" y="238" class="tag">q</text>
  <!-- attention -> output (weights) -->
  <line x1="738" y1="280" x2="738" y2="328" stroke="#555" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="746" y="308" class="tag">w</text>
  <!-- raw values D -> output (dashed) -->
  <path d="M104,202 C104,300 300,362 618,372" fill="none" stroke="#7aa8d6" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="250" y="352" class="dim">raw candidate values D (targets of the weighted average)</text>

  <!-- notes -->
  <text x="14" y="422" class="dim" font-size="11.3">• attention softmaxes over the "candidate axis K" (per row T). Output = weighted average of raw candidate values D = bagging (top-k hurts; all-average best). K is variable = tolerant to candidate count.</text>
</svg>
