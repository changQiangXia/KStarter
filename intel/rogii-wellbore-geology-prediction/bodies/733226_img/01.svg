<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" font-family="'Segoe UI',Arial,sans-serif" font-size="12">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .ttl{font-weight:700;fill:#111827;}
      .sub{fill:#374151;font-size:12px;}
      .dim{fill:#6b7280;font-size:11px;}
      .box{stroke-width:1.3;}
      .tag{fill:#b45309;font-weight:700;font-size:12px;}
    </style>
  </defs>
  <rect x="0" y="0" width="1040" height="360" fill="#ffffff"/>
  <text x="520" y="30" text-anchor="middle" class="ttl" font-size="17">Solution overview — many PF candidates, fused by one ensembler</text>

  <rect class="box" x="16"  y="104" width="150" height="112" rx="9" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="91"  y="132" text-anchor="middle" class="ttl" font-size="13">inputs</text>
  <text x="91"  y="160" text-anchor="middle" class="sub">horizontal-well GR</text>
  <text x="91"  y="182" text-anchor="middle" class="sub">typewell (GR–TVT)</text>

  <rect class="box" x="196" y="104" width="214" height="112" rx="9" fill="#eef6ee" stroke="#8fbf8f"/>
  <text x="303" y="130" text-anchor="middle" class="ttl" font-size="13">Particle Filter</text>
  <text x="303" y="156" text-anchor="middle" class="sub">Optuna-tuned · GPU</text>
  <text x="303" y="177" text-anchor="middle" class="sub">smoother</text>
  <text x="303" y="198" text-anchor="middle" class="sub">GR-free physical prior</text>

  <rect class="box" x="440" y="104" width="176" height="112" rx="9" fill="#fff7ec" stroke="#e0b072"/>
  <text x="528" y="128" text-anchor="middle" class="ttl" font-size="13">91 candidate trajectories</text>
  <polyline points="449,148.8 456,152.0 463,154.6 471,156.1 478,156.2 485,155.0 492,152.7 499,149.8 507,146.9 514,144.6 521,143.5 528,143.6 535,145.2 542,147.8 550,151.0 557,154.2 564,156.8 571,158.2 578,158.3 586,157.0 593,154.7 600,151.8" fill="none" stroke="#c7ccd1" stroke-width="1"/>
  <polyline points="449,164.8 456,165.9 463,165.3 471,163.0 478,159.6 485,155.7 492,152.2 499,149.8 507,149.0 514,150.0 521,152.6 528,156.4 535,160.5 542,164.3 550,167.0 557,168.0 564,167.3 571,165.0 578,161.5 586,157.6 593,154.2 600,151.8" fill="none" stroke="#c7ccd1" stroke-width="1"/>
  <polyline points="449,149.7 456,147.8 463,145.3 471,142.9 478,140.9 485,139.8 492,139.8 499,141.0 507,143.2 514,146.0 521,148.7 528,151.0 535,152.4 542,152.6 550,151.7 557,149.8 564,147.3 571,144.9 578,142.9 586,141.8 593,141.9 600,143.2" fill="none" stroke="#c7ccd1" stroke-width="1"/>
  <polyline points="449,162.1 456,158.8 463,156.0 471,154.5 478,154.5 485,156.1 492,159.0 499,162.6 507,166.2 514,169.2 521,171.0 528,171.3 535,170.0 542,167.4 550,164.1 557,160.7 564,158.1 571,156.6 578,156.7 586,158.3 593,161.2 600,164.8" fill="none" stroke="#c7ccd1" stroke-width="1"/>
  <polyline points="449,144.2 456,142.3 463,142.3 471,144.2 478,147.8 485,152.2 492,156.7 499,160.5 507,162.7 514,163.0 521,161.3 528,158.0 535,153.8 542,149.6 550,146.2 557,144.4 564,144.4 571,146.4 578,150.0 586,154.5 593,159.0 600,162.7" fill="none" stroke="#c7ccd1" stroke-width="1"/>
  <polyline points="449,160.8 456,160.2 463,158.3 471,155.6 478,152.6 485,150.0 492,148.3 499,147.9 507,148.8 514,151.0 521,154.0 528,157.3 535,160.2 542,162.2 550,162.9 557,162.2 564,160.3 571,157.6 578,154.6 586,152.0 593,150.3 600,150.0" fill="none" stroke="#c2410c" stroke-width="1.8"/>
  <text x="528" y="204" text-anchor="middle" class="dim">diversity is the crux</text>

  <rect class="box" x="646" y="104" width="184" height="112" rx="9" fill="#f3eefb" stroke="#b49bd8"/>
  <text x="738" y="138" text-anchor="middle" class="ttl" font-size="13">ensembler</text>
  <text x="738" y="164" text-anchor="middle" class="sub">soft-average candidates</text>
  <text x="738" y="185" text-anchor="middle" class="sub">per row (bagging)</text>

  <rect class="box" x="860" y="104" width="164" height="112" rx="9" fill="#eaf3fb" stroke="#7aa8d6"/>
  <text x="942" y="150" text-anchor="middle" class="ttl" font-size="13">TVT prediction</text>
  <text x="942" y="176" text-anchor="middle" class="sub">CV ≈ 5.4</text>

  <line x1="166" y1="160" x2="193" y2="160" stroke="#555" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="410" y1="160" x2="437" y2="160" stroke="#555" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="616" y1="160" x2="643" y2="160" stroke="#555" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="830" y1="160" x2="857" y2="160" stroke="#555" stroke-width="1.6" marker-end="url(#arw)"/>

  <path d="M303,216 L303,236 L528,236 L528,252" fill="none" stroke="#9aa3af" stroke-width="1.2" marker-end="url(#arw)"/>
  <rect x="138" y="254" width="540" height="52" rx="8" fill="#fafafa" stroke="#d1d5db"/>
  <text x="408" y="277" text-anchor="middle" class="sub"><tspan class="tag">candidates = </tspan>16 parameter sets × 5 GR representations (tw / self / neighbor / nbr-GR5 / self-graft)</text>
  <text x="408" y="296" text-anchor="middle" class="sub">× smoothing × physical prior　→　<tspan class="tag">91</tspan> candidate trajectories in total</text>

  <text x="860" y="286" text-anchor="middle" class="ttl" font-size="12.5">The strength lives in the candidates (features)</text>
  <text x="860" y="305" text-anchor="middle" class="dim">not a heavy model — how to make good candidates and fuse them</text>
</svg>
